services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: family_assistance
      POSTGRES_USER: fam
      POSTGRES_PASSWORD: fam_dev_password
    ports:
      - "5432:5432"
    volumes:
      - fam_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fam -d family_assistance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: FamilyAssistance.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=family_assistance;Username=fam;Password=fam_dev_password"
      SUPERADMIN_INITIAL_PASSWORD: "ChangeMe123!"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost"
      Cors__AllowedOrigins__2: "http://web"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  fam_pg_data:
